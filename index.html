<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bora Druckdifferenz Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.1.0"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #39d0fa; /* W2H Hintergrundfarbe */
      color: #0f172a;
    }
    .w2h-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 1rem;
    }
    .w2h-back {
      display: inline-block;
      margin: 1rem 0;
      padding: 8px 12px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      text-decoration: none;
      color: #111827;
      font-weight: 600;
    }
    .w2h-card {
      background: #fff;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      margin-bottom: 1.5rem;
    }
    .w2h-card h1 { margin-top: 0; font-size: 1.3rem; }
    .w2h-card h2 { margin: 0 0 .5rem 0; font-size: 1.15rem; }
    .w2h-card p { margin: 0.5rem 0; line-height: 1.5; }
    canvas {
      width: 100%;
      max-width: 960px;
      height: 400px;
      display: block;
      margin: 30px auto;
    }
    #lineLegend {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      flex-wrap: wrap;
    }
    .legend-white { color: #000; }
    .legend-orange { color: #FFA500; }
    .legend-red { color: #FF0000; }
  </style>
</head>
<body>
  <div class="w2h-wrap">
    <a id="back-home" class="w2h-back" href="#">← Back</a>

    <section class="w2h-card">
      <h1 id="boraTitle"></h1>
      <p id="boraP1"></p>
      <p id="boraP2"></p>
      <p id="boraP3"></p>
      <p id="boraNote" style="font-size:.9rem;opacity:.85"></p>
    </section>

    <h2>Wochenprognose</h2>
    <canvas id="boraChartWeek"></canvas>
    <div id="lineLegend">
      <div class="legend-white">0 = keine Druckdifferenz</div>
      <div class="legend-orange">–4 hPa – Bora möglich</div>
      <div class="legend-red">–8 hPa – Starke Bora</div>
    </div>

    <!-- Echtzeitvergleich (Realo) – jetzt mit Picker -->
    <section class="w2h-card" aria-label="Aktuelle Messwerte vor Ort">
      <h2>Aktuell vor Ort – <span id="livewind-place">…</span></h2>

      <div id="livewind-embed"
           data-station="16108"
           data-height="76"
           data-picker="1"
           data-stations="assets/stations.json"></div>

      <p style="margin:.6rem 0 0 0; font-size:.85rem; color:#475569">
        Live-Daten eingebettet von <strong>LiveWind</strong> •
        <a id="livewind-open" href="#" target="_blank" rel="noopener noreferrer">Vollansicht öffnen</a>
      </p>
      <p style="margin:.25rem 0 0 0; font-size:.8rem; color:#64748b">
        Quelle: <a href="https://meteostat.net" target="_blank" rel="noopener">Meteostat</a>
      </p>
    </section>

    <h2>Detailansicht der nächsten 48 Stunden</h2>
    <canvas id="boraChart48h"></canvas>
    <div id="lineLegend">
      <div class="legend-white">0 = keine Druckdifferenz</div>
      <div class="legend-orange">–4 hPa – Bora möglich</div>
      <div class="legend-red">–8 hPa – Starke Bora</div>
    </div>
  </div>

<script>
  // --- Alle Sprachen lokal eingebaut ---
  const I18N = {
    de: {
      back: "Zurück zur Hauptseite",
      title: "Bora – Fallwind an der Adria",
      p1: "Die Bora ist ein kalter, böiger Fallwind an der Adriaküste und kann plötzlich mit Orkanstärke auftreten und Windgeschwindigkeiten von über 200 km/h erreichen.",
      p2: "Recht gut prognostizierbar ist die Bora anhand des Luftdruck-Unterschieds zwischen den Wetterstationen in Triest und Maribor.",
      p3: "Ist der Luftdruck in Triest 4 hPa (orange Linie) niedriger (−4 hPa) als in Maribor, entsteht Bora; bei 8 hPa Differenz (−8 hPa, rote Linie) kann sie stürmisch sein. Die dünne weiße Linie (0 hPa) zeigt ausgeglichene Werte an.",
      note: "Die dargestellten Live-Wetterdaten (Druck, Windrichtung und -geschwindigkeit) stammen von Open-Meteo.com, einer frei zugänglichen Plattform, die numerische Wettermodelle wie ICON und GFS verarbeitet. Hinweis: Die Daten dienen der Visualisierung und sind nicht behördlich geprüft."
    },
    en: {
      back: "Back to homepage",
      title: "Bora – Katabatic wind on the Adriatic",
      p1: "The Bora is a cold, gusty downslope wind along the Adriatic coast that can suddenly reach hurricane force with wind speeds exceeding 200 km/h.",
      p2: "The Bora can be forecast reasonably well using the air-pressure difference between the weather stations in Trieste and Maribor.",
      p3: "When pressure in Trieste is 4 hPa lower (−4 hPa, orange line) than in Maribor, Bora develops; at an 8 hPa difference (−8 hPa, red line) it can become stormy. The thin white line (0 hPa) indicates balanced values.",
      note: "The displayed live weather data (pressure, direction and speed) is sourced from Open-Meteo.com, a free platform processing numerical weather models such as ICON and GFS. Note: The data is for visualization and is not officially certified."
    },
    it: { /* ... unverändert ... */ },
    hr: { /* ... unverändert ... */ },
    fr: { /* ... unverändert ... */ }
  };

  function pickLang() {
    const sp = new URLSearchParams(location.search);
    const explicit = (sp.get('lang') || '').toLowerCase();
    if (['de','en','it','hr','fr'].includes(explicit)) return explicit;

    const back = sp.get('back') || document.referrer || '';
    if (back.includes('/en')) return 'en';
    if (back.includes('/it')) return 'it';
    if (back.includes('/hr')) return 'hr';
    if (back.includes('/fr')) return 'fr';
    if (back.includes('/de')) return 'de';
    return 'de';
  }

  (function init() {
    const lang = pickLang();
    const t = I18N[lang];

    document.getElementById('boraTitle').textContent = t.title;
    document.getElementById('boraP1').textContent   = t.p1;
    document.getElementById('boraP2').textContent   = t.p2;
    document.getElementById('boraP3').textContent   = t.p3;
    document.getElementById('boraNote').textContent = t.note;

    const sp = new URLSearchParams(location.search);
    const back = sp.get('back');
    const a = document.getElementById('back-home');
    a.textContent = '← ' + t.back;
    if (back) a.href = back;
    else if (document.referrer) a.href = document.referrer;
    else a.href = 'https://beta.wind2horizon.com/' + lang + '#bora';
  })();
</script>

<!-- Picker/Embed Modul laden (RELATIVER Pfad für GitHub Pages) -->
<script src="assets/livewind-embed-picker.js" defer></script>

<script>
  // deine bestehende Chart-Logik unverändert ...
</script>
</body>
</html>
