<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Druckdifferenz Triest–Maribor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.1.0"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background-image: url('https://wind2horizon.com/_files/ugd/9a5b66_e3b91f3547b14f71a37dbd24b7a7a35c~mv2.jpg');
      background-size: cover;
      background-position: center;
      color: white;
    }
    h2 {
      text-align: center;
      margin: 30px 0 10px 0;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: 300px;
      margin: 0 auto;
    }
    #legendContainer {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px auto;
      font-size: 14px;
    }
    .legendItem {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .colorBox {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
    .white { background-color: white; border: 1px solid #aaa; }
    .orange { background-color: #FFA500; }
    .red { background-color: #FF0000; }
    #liveWind {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h2>7-Tages-Prognose der Druckdifferenz (ΔP Triest–Maribor)</h2>
<canvas id="boraChart"></canvas>

<div id="legendContainer">
  <div class="legendItem"><span class="colorBox white"></span> ΔP = 0 (kein Druckunterschied)</div>
  <div class="legendItem"><span class="colorBox orange"></span> –4 hPa (Bora möglich)</div>
  <div class="legendItem"><span class="colorBox red"></span> –8 hPa (Starke Bora)</div>
</div>

<h2>48-Stunden-Lupe: Detailverlauf der nächsten zwei Tage</h2>
<canvas id="boraChartZoom"></canvas>

<div id="liveWind">Live-Wind Triest: -- kn aus --°</div>

<script>
let boraChart;
let boraChartZoom;

async function fetchAndUpdateData() {
  const mariborLat = 46.55, mariborLon = 15.65;
  const triestLat = 45.65, triestLon = 13.77;
  const today = new Date();
  const startDate = today.toISOString().split('T')[0];
  const endDate = new Date(today.getTime() + 7*24*60*60*1000).toISOString().split('T')[0];

  const mariborUrl = `https://api.open-meteo.com/v1/forecast?latitude=${mariborLat}&longitude=${mariborLon}&hourly=pressure_msl&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;
  const triestUrl = `https://api.open-meteo.com/v1/forecast?latitude=${triestLat}&longitude=${triestLon}&hourly=pressure_msl,windspeed_10m,winddirection_10m&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;

  try {
    const [mRes, tRes] = await Promise.all([fetch(mariborUrl), fetch(triestUrl)]);
    const mData = await mRes.json(), tData = await tRes.json();

    const mariborPressures = mData.hourly.pressure_msl;
    const triestPressures = tData.hourly.pressure_msl;
    const times = mData.hourly.time;

    const minLen = Math.min(times.length, mariborPressures.length, triestPressures.length);
    const deltas = [];
    const labels = [];

    for (let i = 0; i < minLen; i++) {
      const delta = triestPressures[i] - mariborPressures[i];
      deltas.push(+delta.toFixed(1));
      const d = new Date(times[i]);
      const label = d.getUTCHours() % 6 === 0 ? `${('0'+d.getUTCDate()).slice(-2)}.${('0'+(d.getUTCMonth()+1)).slice(-2)} ${('0'+d.getUTCHours()).slice(-2)}:00` : '';
      labels.push(label);
    }

    updateChart('boraChart', labels, deltas);
    updateChart('boraChartZoom', labels.slice(0,48), deltas.slice(0,48));

    const now = new Date();
    const h = now.getUTCHours();
    document.getElementById('liveWind').textContent = `Live-Wind Triest: ${tData.hourly.windspeed_10m[h]} kn aus ${tData.hourly.winddirection_10m[h]}°`;

  } catch (e) {
    console.error('Fehler beim Laden:', e);
  }
}

function updateChart(canvasId, labels, data) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'ΔP (Triest – Maribor)',
        data,
        borderColor: 'blue',
        backgroundColor: 'transparent',
        pointRadius: 2,
        tension: 0.3,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { min: -15, max: 5, ticks: { stepSize: 2 } }
      },
      plugins: {
        legend: { display: true },
        annotation: {
          annotations: {
            line0: { type: 'line', yMin: 0, yMax: 0, borderColor: 'white', borderWidth: 2 },
            line4: { type: 'line', yMin: -4, yMax: -4, borderColor: '#FFA500', borderWidth: 2 },
            line8: { type: 'line', yMin: -8, yMax: -8, borderColor: '#FF0000', borderWidth: 2 }
          }
        }
      }
    }
  });
  if (canvasId === 'boraChart') boraChart = chart;
  else boraChartZoom = chart;
}

window.onload = fetchAndUpdateData;
</script>

</body>
</html>
