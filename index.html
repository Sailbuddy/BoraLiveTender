<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bora Druckdifferenz Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.1.0"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background-image: url('https://wind2horizon.com/_files/ugd/9a5b66_e3b91f3547b14f71a37dbd24b7a7a35c~mv2.jpg');
      background-size: cover;
      background-position: center;
      color: white;
    }

    h2 {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 10px;
    }

    #boraChart, #boraChartZoom {
      width: 100%;
      max-width: 1000px;
      height: 300px;
      display: block;
      margin: 0 auto;
    }

    #legendContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 20px auto;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .legendItem {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .colorBox {
      width: 12px;
      height: 12px;
      display: inline-block;
    }

    .white { background-color: #FFFFFF; border: 1px solid #ccc; }
    .orange { background-color: #FFA500; }
    .red { background-color: #FF0000; }

    #liveWind {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 5px 10px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h2>7-Tages-Prognose der Druckdifferenz (ΔP Triest–Maribor)</h2>
<canvas id="boraChart"></canvas>

<div id="legendContainer">
  <div class="legendItem"><span class="colorBox white"></span> ΔP = 0 (kein Druckunterschied)</div>
  <div class="legendItem"><span class="colorBox orange"></span> –4 hPa (Bora möglich)</div>
  <div class="legendItem"><span class="colorBox red"></span> –8 hPa (Starke Bora)</div>
</div>

<h2>48-Stunden-Lupe: Detailverlauf der nächsten zwei Tage</h2>
<canvas id="boraChartZoom"></canvas>

<div id="liveWind">Live-Wind Triest: -- kn aus --°</div>

<script>
let boraChart;
let boraChartZoom;

function formatDateLabel(dateStr) {
  const date = new Date(dateStr);
  const day = ('0' + date.getUTCDate()).slice(-2);
  const month = ('0' + (date.getUTCMonth() + 1)).slice(-2);
  return `${day}.${month}`;
}

async function fetchAndUpdateData() {
  const mariborLat = 46.55;
  const mariborLon = 15.65;
  const triestLat = 45.65;
  const triestLon = 13.77;
  const today = new Date();
  const startDate = today.toISOString().split('T')[0];
  const endDate = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

  const mariborUrl = `https://api.open-meteo.com/v1/forecast?latitude=${mariborLat}&longitude=${mariborLon}&hourly=pressure_msl&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;
  const triestUrl = `https://api.open-meteo.com/v1/forecast?latitude=${triestLat}&longitude=${triestLon}&hourly=pressure_msl,windspeed_10m,winddirection_10m&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;

  try {
    const [mariborResponse, triestResponse] = await Promise.all([fetch(mariborUrl), fetch(triestUrl)]);
    const mariborData = await mariborResponse.json();
    const triestData = await triestResponse.json();

    const mariborPressures = mariborData.hourly.pressure_msl;
    const triestPressures = triestData.hourly.pressure_msl;
    const times = mariborData.hourly.time;

    const minLen = Math.min(mariborPressures.length, triestPressures.length, times.length);
    const deltaPressures = [];
    const labels = [];

    for (let i = 0; i < minLen; i++) {
      const delta = triestPressures[i] - mariborPressures[i];
      deltaPressures.push(delta.toFixed(1));
      labels.push(i % 24 === 0 ? formatDateLabel(times[i]) : '');
    }

    updateChart(labels, deltaPressures);

    const zoomDelta = deltaPressures.slice(0, 48);
    const zoomLabels = times.slice(0, 48).map(t => {
      const d = new Date(t);
      return `${('0' + d.getUTCDate()).slice(-2)}.${('0' + (d.getUTCMonth() + 1)).slice(-2)} ${('0' + d.getUTCHours()).slice(-2)}:00`;
    });

    updateZoomChart(zoomLabels, zoomDelta);

    const nowUTC = new Date();
    const currentHour = nowUTC.getUTCHours();
    const liveWindSpeed = triestData.hourly.windspeed_10m[currentHour];
    const liveWindDir = triestData.hourly.winddirection_10m[currentHour];
    document.getElementById('liveWind').textContent = `Live-Wind Triest: ${liveWindSpeed} kn aus ${liveWindDir}°`;

  } catch (error) {
    console.error('Fehler beim Abrufen:', error);
  }
}

function updateChart(labels, data) {
  const ctx = document.getElementById('boraChart').getContext('2d');
  if (boraChart) boraChart.destroy();
  boraChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'ΔP (Triest – Maribor)',
        data,
        borderColor: 'lightblue',
        backgroundColor: 'rgba(173, 216, 230, 0.2)',
        tension: 0.4,
        pointRadius: 0,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          min: -15,
          max: 5,
          ticks: { stepSize: 2 }
        }
      },
      plugins: {
        annotation: {
          annotations: {
            line0: {
              type: 'line',
              yMin: 0,
              yMax: 0,
              borderColor: '#FFFFFF',
              borderWidth: 2
            },
            line4: {
              type: 'line',
              yMin: -4,
              yMax: -4,
              borderColor: '#FFA500',
              borderWidth: 2
            },
            line8: {
              type: 'line',
              yMin: -8,
              yMax: -8,
              borderColor: '#FF0000',
              borderWidth: 2
            }
          }
        }
      }
    }
  });
}

function updateZoomChart(labels, data) {
  const ctx = document.getElementById('boraChartZoom').getContext('2d');
  if (boraChartZoom) boraChartZoom.destroy();
  boraChartZoom = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'ΔP (Triest – Maribor)',
        data,
        borderColor: 'lightblue',
        backgroundColor: 'rgba(173, 216, 230, 0.2)',
        tension: 0.4,
        pointRadius: 0,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          min: -15,
          max: 5,
          ticks: { stepSize: 2 }
        }
      },
      plugins: {
        annotation: {
          annotations: {
            line0: {
              type: 'line',
              yMin: 0,
              yMax: 0,
              borderColor: '#FFFFFF',
              borderWidth: 2
            },
            line4: {
              type: 'line',
              yMin: -4,
              yMax: -4,
              borderColor: '#FFA500',
              borderWidth: 2
            },
            line8: {
              type: 'line',
              yMin: -8,
              yMax: -8,
              borderColor: '#FF0000',
              borderWidth: 2
            }
          }
        }
      }
    }
  });
}

window.onload = fetchAndUpdateData;
</script>

</body>
</html>
