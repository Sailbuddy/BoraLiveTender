<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bora Druckdifferenz Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.1.0"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background-image: url('https://wind2horizon.com/_files/ugd/9a5b66_e3b91f3547b14f71a37dbd24b7a7a35c~mv2.jpg');
      background-size: cover;
      background-position: center;
      color: white;
    }
    h2 {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 10px;
      font-size: 18px;
    }
    canvas {
      width: 100%;
      max-width: 1000px;
      height: 300px;
      display: block;
      margin: 0 auto;
    }
    #boraLegend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 10px 0;
      flex-wrap: wrap;
      font-size: 14px;
    }
    #boraLegend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .white { background-color: white; }
    .orange { background-color: #FFA500; }
    .red { background-color: #FF0000; }
    #liveWind {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>7-Tages-Prognose der Druckdifferenz (ΔP Triest–Maribor)</h2>
  <canvas id="boraChart"></canvas>

  <div id="boraLegend">
    <span><span class="dot white"></span>ΔP = 0 (kein Druckunterschied)</span>
    <span><span class="dot orange"></span>–4 hPa (Bora möglich)</span>
    <span><span class="dot red"></span>–8 hPa (Starke Bora)</span>
  </div>

  <h2>48-Stunden-Lupe: Detailverlauf der nächsten zwei Tage</h2>
  <canvas id="boraDetailChart"></canvas>

  <div id="liveWind">Live-Wind Triest: -- kn aus --°</div>

  <script>
    let boraChart, boraDetailChart;

    async function fetchAndUpdateData() {
      const mariborLat = 46.55, mariborLon = 15.65;
      const triestLat = 45.65, triestLon = 13.77;
      const today = new Date();
      const startDate = today.toISOString().split('T')[0];
      const endDate = new Date(today.getTime() + 7*24*60*60*1000).toISOString().split('T')[0];

      const mariborUrl = `https://api.open-meteo.com/v1/forecast?latitude=${mariborLat}&longitude=${mariborLon}&hourly=pressure_msl&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;
      const triestUrl = `https://api.open-meteo.com/v1/forecast?latitude=${triestLat}&longitude=${triestLon}&hourly=pressure_msl,windspeed_10m,winddirection_10m&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;

      try {
        const [mariborRes, triestRes] = await Promise.all([fetch(mariborUrl), fetch(triestUrl)]);
        const mariborData = await mariborRes.json();
        const triestData = await triestRes.json();

        const mariborPressures = mariborData.hourly.pressure_msl;
        const triestPressures = triestData.hourly.pressure_msl;
        const times = mariborData.hourly.time;

        const deltaP = triestPressures.map((tp, i) => (tp - mariborPressures[i]).toFixed(1));

        const labelsWeek = times.map((t, i) => {
          const d = new Date(t);
          return d.getUTCHours() === 0 ? ('0'+d.getUTCDate()).slice(-2)+'.'+('0'+(d.getUTCMonth()+1)).slice(-2) : '';
        });

        const labels48h = times.slice(0, 48).map((t, i) => {
          const d = new Date(t);
          return d.getUTCHours() % 6 === 0 ? ('0'+d.getUTCDate()).slice(-2)+'.'+('0'+(d.getUTCMonth()+1)).slice(-2)+' '+('0'+d.getUTCHours()).slice(-2)+':00' : '';
        });

        drawChart('boraChart', labelsWeek, deltaP, 0, deltaP.length, false);
        drawChart('boraDetailChart', labels48h, deltaP, 0, 48, true);

        const nowUTC = new Date();
        const currentHour = nowUTC.getUTCHours();
        const windSpeed = triestData.hourly.windspeed_10m[currentHour];
        const windDir = triestData.hourly.winddirection_10m[currentHour];
        document.getElementById('liveWind').textContent = `Live-Wind Triest: ${windSpeed} kn aus ${windDir}°`;

      } catch (err) {
        console.error('Fehler beim Abrufen:', err);
      }
    }

    function drawChart(canvasId, labels, data, startIdx, endIdx, isZoom) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      const chartRef = canvasId === 'boraChart' ? 'boraChart' : 'boraDetailChart';
      if (window[chartRef]) window[chartRef].destroy();

      window[chartRef] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'ΔP (Triest – Maribor)',
            data: data.slice(startIdx, endIdx),
            borderColor: 'blue',
            backgroundColor: 'lightblue',
            tension: 0.4,
            pointRadius: 0,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: -15,
              max: 5,
              ticks: { stepSize: 2, color: 'white' }
            },
            x: {
              ticks: { color: 'white', maxRotation: 45, minRotation: 45 }
            }
          },
          plugins: {
            legend: { display: false },
            annotation: {
              annotations: {
                line0: {
                  type: 'line',
                  yMin: 0,
                  yMax: 0,
                  borderColor: 'white',
                  borderWidth: 2
                },
                line4: {
                  type: 'line',
                  yMin: -4,
                  yMax: -4,
                  borderColor: '#FFA500',
                  borderWidth: 2
                },
                line8: {
                  type: 'line',
                  yMin: -8,
                  yMax: -8,
                  borderColor: '#FF0000',
                  borderWidth: 2
                }
              }
            },
            tooltip: {
              mode: 'index',
              intersect: false
            }
          }
        }
      });
    }

    window.onload = fetchAndUpdateData;
  </script>
</body>
</html>
