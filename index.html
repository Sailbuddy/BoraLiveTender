<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bora Druckdifferenz</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: url('bg.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: white;
      margin: 20px;
    }
    canvas {
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    .chart-container {
      margin-bottom: 60px;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 2em;
      font-size: 14px;
      margin-top: 10px;
    }
    .legend span {
      display: inline-block;
      padding-left: 20px;
      position: relative;
    }
    .legend .zero::before {
      content: "";
      position: absolute;
      left: 0;
      top: 5px;
      width: 15px;
      height: 2px;
      background: white;
    }
    .legend .minus4::before {
      content: "";
      position: absolute;
      left: 0;
      top: 5px;
      width: 15px;
      height: 2px;
      background: orange;
    }
    .legend .minus8::before {
      content: "";
      position: absolute;
      left: 0;
      top: 5px;
      width: 15px;
      height: 2px;
      background: red;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <p>Raw data retrieved from DWD (Datenquelle DWD) <a href="https://www.dwd.de/DE/Home/home_node.html" target="_blank">https://www.dwd.de/DE/Home/home_node.html</a></p>
    <canvas id="chart1" width="800" height="400"></canvas>
    <div class="legend">
      <span class="zero">0 = keine Druckdifferenz</span>
      <span class="minus4">–4 hPa = Bora möglich</span>
      <span class="minus8">–8 hPa = Starke Bora</span>
    </div>
  </div>
  <div class="chart-container">
    <h3 style="text-align:center; margin-bottom: 10px;">Detailansicht der nächsten 48 Stunden</h3>
    <canvas id="chart2" width="800" height="400"></canvas>
    <div class="legend">
      <span class="zero">0 = keine Druckdifferenz</span>
      <span class="minus4">–4 hPa = Bora möglich</span>
      <span class="minus8">–8 hPa = Starke Bora</span>
    </div>
  </div>
  <script>
    const labels1 = [...Array(168).keys()].map(i => {
      const date = new Date();
      date.setHours(date.getHours() + i);
      const h = date.getHours().toString().padStart(2, '0');
      const d = date.getDate().toString().padStart(2, '0');
      const m = (date.getMonth() + 1).toString().padStart(2, '0');
      return `${d}.${m}\n${h}:00`;
    });

    const data1 = labels1.map((_, i) => Math.sin(i / 10) * 3 - 3);

    const ctx1 = document.getElementById('chart1').getContext('2d');
    new Chart(ctx1, {
      type: 'line',
      data: {
        labels: labels1,
        datasets: [{
          label: 'ΔP (Druckdifferenz Triest–Maribor)',
          data: data1,
          borderColor: 'blue',
          backgroundColor: 'transparent',
          pointBackgroundColor: 'white',
          borderWidth: 2,
          tension: 0.3,
          pointRadius: 3
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            min: -15,
            max: 5,
            grid: { color: 'white' }
          },
          x: {
            ticks: {
              callback: function(val, index) {
                const tick = this.getLabelForValue(index);
                const time = tick.split('\n')[1].slice(0,2);
                if (time === "00") {
                  return tick.split('\n')[0]; // Datum schräg
                }
                return time; // Uhrzeit
              },
              color: 'white',
              maxRotation: 0,
              minRotation: 0
            },
            grid: {
              color: function(ctx) {
                const tick = ctx.tick.label.split('\n')[1];
                return tick?.startsWith('00') ? 'white' : 'transparent';
              }
            }
          }
        },
        plugins: {
          tooltip: { enabled: true },
          legend: { display: true }
        }
      }
    });

    const labels2 = [...Array(48).keys()].map(i => {
      const date = new Date();
      date.setHours(date.getHours() + i);
      const h = date.getHours().toString().padStart(2, '0');
      const d = date.getDate().toString().padStart(2, '0');
      const m = (date.getMonth() + 1).toString().padStart(2, '0');
      return `${d}.${m}\n${h}:00`;
    });

    const data2 = labels2.map((_, i) => Math.sin(i / 5) * 3 - 3);

    const ctx2 = document.getElementById('chart2').getContext('2d');
    new Chart(ctx2, {
      type: 'line',
      data: {
        labels: labels2,
        datasets: [{
          label: 'ΔP (Druckdifferenz Triest–Maribor)',
          data: data2,
          borderColor: 'blue',
          backgroundColor: 'transparent',
          pointBackgroundColor: 'white',
          borderWidth: 2,
          tension: 0.3,
          pointRadius: 3
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            min: -15,
            max: 5,
            grid: { color: 'white' }
          },
          x: {
            ticks: {
              callback: function(val, index) {
                const tick = this.getLabelForValue(index);
                const [d, t] = tick.split('\n');
                if (t.startsWith("00")) return d; // schräges Datum
                return t.slice(0, 2); // Uhrzeit 2-stellig
              },
              color: 'white',
              maxRotation: 0,
              minRotation: 0
            },
            grid: {
              color: function(ctx) {
                const tick = ctx.tick.label.split('\n')[1];
                return tick?.startsWith('00') ? 'white' : 'transparent';
              }
            }
          }
        },
        plugins: {
          tooltip: { enabled: true },
          legend: { display: true }
        }
      }
    });
  </script>
</body>
</html>
