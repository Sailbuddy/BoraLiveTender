<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bora Druckdifferenz Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.1.0"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    #boraChart {
      width: 100%;
      height: 70vh;
    }

    #liveWind {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 14px;
    }

    #lineLegend {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      flex-wrap: wrap;
    }

    .legend-white { color: white; }
    .legend-orange { color: #FFA500; }
    .legend-red { color: #FF0000; }
  </style>
</head>
<body>

<canvas id="boraChart"></canvas>

<div id="lineLegend">
  <div class="legend-white">0 = keine Druckdifferenz</div>
  <div class="legend-orange">–4 hPa – Bora möglich</div>
  <div class="legend-red">–8 hPa – Starke Bora</div>
</div>

<div id="liveWind">Live-Wind Triest: -- kn aus --°</div>

<script>
let boraChart;

async function fetchAndUpdateData() {
  const mariborLat = 46.55;
  const mariborLon = 15.65;
  const triestLat = 45.65;
  const triestLon = 13.77;
  const today = new Date();
  const startDate = today.toISOString().split('T')[0];
  const endDate = new Date(today.getTime() + 7*24*60*60*1000).toISOString().split('T')[0];

  const mariborUrl = `https://api.open-meteo.com/v1/forecast?latitude=${mariborLat}&longitude=${mariborLon}&hourly=pressure_msl&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;
  const triestUrl = `https://api.open-meteo.com/v1/forecast?latitude=${triestLat}&longitude=${triestLon}&hourly=pressure_msl,windspeed_10m,winddirection_10m&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;

  try {
    const [mariborResponse, triestResponse] = await Promise.all([fetch(mariborUrl), fetch(triestUrl)]);
    const mariborData = mariborResponse.json();
    const triestData = triestResponse.json();

    const mariborPressures = (await mariborData).hourly.pressure_msl;
    const triestPressures = (await triestData).hourly.pressure_msl;
    const times = (await mariborData).hourly.time;

    // Reduziere auf 1 Wert pro Tag (z. B. 12:00 UTC)
    const filteredLabels = [];
    const filteredValues = [];

    for (let i = 0; i < times.length; i++) {
      const date = new Date(times[i]);
      if (date.getUTCHours() === 12) {
        const delta = triestPressures[i] - mariborPressures[i];
        const label = ('0' + date.getUTCDate()).slice(-2) + '.' +
                      ('0' + (date.getUTCMonth() + 1)).slice(-2);
        filteredLabels.push(label);
        filteredValues.push(delta.toFixed(1));
      }
    }

    updateChart(filteredLabels, filteredValues);

    // Live-Windanzeige (aktueller UTC-Wert)
    const nowUTC = new Date();
    const currentHour = nowUTC.getUTCHours();
    const liveWindSpeed = (await triestData).hourly.windspeed_10m[currentHour];
    const liveWindDir = (await triestData).hourly.winddirection_10m[currentHour];
    document.getElementById('liveWind').textContent = `Live-Wind Triest: ${liveWindSpeed} kn aus ${liveWindDir}°`;
  } catch (error) {
    console.error('Fehler beim Abrufen:', error);
  }
}

function updateChart(labels, data) {
  const ctx = document.getElementById('boraChart').getContext('2d');
  if (boraChart) boraChart.destroy();

  boraChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'ΔP (Druckdifferenz Triest–Maribor)',
        data: data,
        borderColor: 'blue',
        backgroundColor: 'lightblue',
        tension: 0.4,
        pointRadius: 3,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: {
          grid: {
            display: true,
            drawOnChartArea: true,
            drawTicks: true,
            color: '#888'
          },
          ticks: {
            maxRotation: 0,
            minRotation: 0
          }
        },
        y: {
          min: -15,
          max: 5,
          ticks: { stepSize: 2 }
        }
      },
      plugins: {
        legend: {
          labels: {
            font: { size: 14 }
          }
        },
        annotation: {
          annotations: {
            line4hPa: {
              type: 'line',
              yMin: -4,
              yMax: -4,
              borderColor: '#FFA500',
              borderWidth: 2
            },
            line0hPa: {
              type: 'line',
              yMin: 0,
              yMax: 0,
              borderColor: 'white',
              borderWidth: 1
            },
            line8hPa: {
              type: 'line',
              yMin: -8,
              yMax: -8,
              borderColor: '#FF0000',
              borderWidth: 2
            }
          }
        }
      }
    }
  });
}

window.onload = fetchAndUpdateData;
</script>

</body>
</html>
