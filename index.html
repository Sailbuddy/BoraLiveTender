<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bora Druckdifferenz Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.1.0"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: black;
      color: white;
    }
    h2 {
      text-align: center;
      margin: 20px 0 10px 0;
      font-size: 18px;
    }
    canvas {
      width: 100%;
      max-width: 1000px;
      height: 300px;
      display: block;
      margin: 0 auto;
    }
    #liveWind {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h2>7-Tages-Prognose der Druckdifferenz (ΔP Triest–Maribor)</h2>
<canvas id="boraChart"></canvas>

<h2>48-Stunden-Lupe: Detailverlauf der nächsten zwei Tage</h2>
<canvas id="boraChartZoom"></canvas>

<div id="liveWind">Live-Wind Triest: -- kn aus --°</div>

<script>
let boraChart, boraChartZoom;

function formatDateLabel(t) {
  const d = new Date(t);
  return ('0' + d.getUTCDate()).slice(-2) + '.' +
         ('0' + (d.getUTCMonth() + 1)).slice(-2) + ' ' +
         ('0' + d.getUTCHours()).slice(-2) + ':00';
}

async function fetchAndUpdateData() {
  const mariborLat = 46.55;
  const mariborLon = 15.65;
  const triestLat = 45.65;
  const triestLon = 13.77;
  const today = new Date();
  const startDate = today.toISOString().split('T')[0];
  const endDate = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

  const mariborUrl = `https://api.open-meteo.com/v1/forecast?latitude=${mariborLat}&longitude=${mariborLon}&hourly=pressure_msl&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;
  const triestUrl = `https://api.open-meteo.com/v1/forecast?latitude=${triestLat}&longitude=${triestLon}&hourly=pressure_msl,windspeed_10m,winddirection_10m&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;

  try {
    const [mariborRes, triestRes] = await Promise.all([fetch(mariborUrl), fetch(triestUrl)]);
    const mariborData = await mariborRes.json();
    const triestData = await triestRes.json();

    const mariborPressures = mariborData.hourly.pressure_msl;
    const triestPressures = triestData.hourly.pressure_msl;
    const times = mariborData.hourly.time;

    const deltaPressures = triestPressures.map((tp, i) => (tp - mariborPressures[i]).toFixed(1));

    const labels = times.map((t, i) => {
      const d = new Date(t);
      return (d.getUTCHours() % 12 === 0) ? formatDateLabel(t) : '';
    });

    const zoomLabels = times.slice(0, 48).map(formatDateLabel);
    const zoomData = deltaPressures.slice(0, 48);

    updateChart('boraChart', labels, deltaPressures);
    updateChart('boraChartZoom', zoomLabels, zoomData);

    const currentHour = new Date().getUTCHours();
    const liveWindSpeed = triestData.hourly.windspeed_10m[currentHour];
    const liveWindDir = triestData.hourly.winddirection_10m[currentHour];
    document.getElementById('liveWind').textContent = `Live-Wind Triest: ${liveWindSpeed} kn aus ${liveWindDir}°`;
  } catch (err) {
    console.error('Fehler beim Abrufen:', err);
  }
}

function updateChart(canvasId, labels, data) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'ΔP (Triest–Maribor)',
        data,
        borderColor: 'blue',
        backgroundColor: 'lightblue',
        tension: 0.4,
        pointRadius: 2,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          min: -15,
          max: 5,
          ticks: { stepSize: 2 }
        }
      }
    }
  });

  if (canvasId === 'boraChart') boraChart = chart;
  if (canvasId === 'boraChartZoom') boraChartZoom = chart;
}

window.onload = fetchAndUpdateData;
</script>

</body>
</html>
