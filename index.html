<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bora Druckdifferenz Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: black; }
    #chart1, #chart2 { width: 100%; height: 45vh; display: block; }
    h2 { text-align: center; color: white; margin: 10px 0 0; font-family: sans-serif; }
    #liveWind {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 5px 10px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>7-Tages-Prognose der Druckdifferenz (&#916;P Triest–Maribor)</h2>
  <canvas id="chart1"></canvas>
  <h2>48-Stunden-Lupe: Detailverlauf der nächsten zwei Tage</h2>
  <canvas id="chart2"></canvas>
  <div id="liveWind">Live-Wind Triest: -- kn aus --°</div>

<script>
let chart1, chart2;

async function fetchAndUpdateData() {
  const mariborLat = 46.55, mariborLon = 15.65;
  const triestLat = 45.65, triestLon = 13.77;
  const today = new Date();
  const startDate = today.toISOString().split('T')[0];
  const endDate = new Date(today.getTime() + 7*24*60*60*1000).toISOString().split('T')[0];

  const mariborUrl = `https://api.open-meteo.com/v1/forecast?latitude=${mariborLat}&longitude=${mariborLon}&hourly=pressure_msl&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;
  const triestUrl = `https://api.open-meteo.com/v1/forecast?latitude=${triestLat}&longitude=${triestLon}&hourly=pressure_msl,windspeed_10m,winddirection_10m&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;

  try {
    const [mariborResponse, triestResponse] = await Promise.all([fetch(mariborUrl), fetch(triestUrl)]);
    const mariborData = await mariborResponse.json();
    const triestData = await triestResponse.json();

    const mariborPressures = mariborData.hourly.pressure_msl;
    const triestPressures = triestData.hourly.pressure_msl;
    const times = mariborData.hourly.time;

    const deltaPressures = triestPressures.map((tp, i) => (tp - mariborPressures[i]).toFixed(1));

    const labels7d = times.map((t, i) => {
      const d = new Date(t);
      const h = d.getUTCHours();
      return h % 12 === 0 ? `${('0'+d.getUTCDate()).slice(-2)}.${('0'+(d.getUTCMonth()+1)).slice(-2)} ${('0'+h).slice(-2)}:00` : '';
    });

    const labels2d = times.slice(0, 48).map((t, i) => {
      const d = new Date(t);
      return `${('0'+d.getUTCDate()).slice(-2)}.${('0'+(d.getUTCMonth()+1)).slice(-2)} ${('0'+d.getUTCHours()).slice(-2)}:00`;
    });

    const data2d = deltaPressures.slice(0, 48);

    drawChart('chart1', labels7d, deltaPressures);
    drawChart('chart2', labels2d, data2d);

    const now = new Date();
    const h = now.getUTCHours();
    const ws = triestData.hourly.windspeed_10m[h];
    const wd = triestData.hourly.winddirection_10m[h];
    document.getElementById("liveWind").textContent = `Live-Wind Triest: ${ws} kn aus ${wd}°`;
  } catch (e) {
    console.error("Fehler beim Abruf:", e);
  }
}

function drawChart(canvasId, labels, data) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  if (window[canvasId]) window[canvasId].destroy();
  window[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'ΔP (Triest–Maribor)',
        data: data,
        borderColor: 'blue',
        backgroundColor: 'lightblue',
        tension: 0.4,
        pointRadius: 1,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: {
          ticks: { maxRotation: 45, minRotation: 45, autoSkip: false }
        },
        y: {
          min: -15,
          max: 5,
          ticks: { stepSize: 2 }
        }
      },
      plugins: {
        legend: { labels: { color: 'white' } }
      }
    }
  });
}

window.onload = fetchAndUpdateData;
</script>
</body>
</html>
