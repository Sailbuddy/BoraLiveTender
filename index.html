<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Bora Druckdifferenz Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: sans-serif;
      color: white;
      text-align: center;
    }
    h2 {
      margin: 10px 0 5px;
      font-size: 1.1em;
      color: #ffffff;
    }
    canvas {
      width: 100% !important;
      height: auto !important;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 6px 0 14px;
      flex-wrap: wrap;
      font-size: 14px;
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend .box {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
    .white { background: #ffffff; }
    .orange { background: #f5a623; }
    .red { background: #e74c3c; }
    #liveWind {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h2>7-Tages-Prognose der Druckdifferenz (ΔP Triest–Maribor)</h2>
  <canvas id="boraChart7d"></canvas>

  <div class="legend">
    <span><span class="box white"></span> ΔP = 0 (kein Druckunterschied)</span>
    <span><span class="box orange"></span> −4 hPa (Bora möglich)</span>
    <span><span class="box red"></span> −8 hPa (Starke Bora)</span>
  </div>

  <h2>48-Stunden-Lupe: Detailverlauf der nächsten zwei Tage</h2>
  <canvas id="boraChart48h"></canvas>

  <div id="liveWind">Live-Wind Triest: -- kn aus --°</div>

  <script>
    let chart7d, chart48h;

    async function fetchAndUpdateData() {
      const maribor = { lat: 46.55, lon: 15.65 };
      const triest = { lat: 45.65, lon: 13.77 };
      const now = new Date();
      const startDate = now.toISOString().split('T')[0];
      const endDate = new Date(now.getTime() + 7 * 86400000).toISOString().split('T')[0];

      const url = (lat, lon) =>
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=pressure_msl,windspeed_10m,winddirection_10m&start_date=${startDate}&end_date=${endDate}&timezone=UTC`;

      try {
        const [mariborRes, triestRes] = await Promise.all([fetch(url(maribor.lat, maribor.lon)), fetch(url(triest.lat, triest.lon))]);
        const mariborData = await mariborRes.json();
        const triestData = await triestRes.json();

        const times = triestData.hourly.time;
        const deltaP = triestData.hourly.pressure_msl.map((p, i) => +(p - mariborData.hourly.pressure_msl[i]).toFixed(1));
        const labelsFull = times.map(t => {
          const d = new Date(t);
          return `${("0" + d.getUTCDate()).slice(-2)}.${("0" + (d.getUTCMonth() + 1)).slice(-2)} ${("0" + d.getUTCHours()).slice(-2)}:00`;
        });

        const nowUTC = new Date();
        const liveWindSpeed = triestData.hourly.windspeed_10m[nowUTC.getUTCHours()];
        const liveWindDir = triestData.hourly.winddirection_10m[nowUTC.getUTCHours()];
        document.getElementById('liveWind').textContent = `Live-Wind Triest: ${liveWindSpeed} kn aus ${liveWindDir}°`;

        const labels7d = labelsFull.filter((_, i) => i % 24 === 0);  // Tagesintervalle
        const reducedLabels7d = deltaP.filter((_, i) => i % 24 === 0);

        const labels48h = labelsFull.slice(0, 48);
        const values48h = deltaP.slice(0, 48);

        renderChart('boraChart7d', labels7d, reducedLabels7d, chart => chart7d = chart);
        renderChart('boraChart48h', labels48h, values48h, chart => chart48h = chart);
      } catch (err) {
        console.error('Fehler beim Laden der Daten:', err);
      }
    }

    function renderChart(id, labels, data, storeChart) {
      const ctx = document.getElementById(id).getContext('2d');
      if (storeChart) storeChart?.destroy?.();

      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'ΔP (Triest – Maribor)',
            data,
            borderColor: 'blue',
            backgroundColor: 'rgba(173, 216, 230, 0.2)',
            tension: 0.3,
            pointRadius: 0,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          interaction: {
            mode: 'index',
            intersect: false
          },
          scales: {
            y: {
              min: -15,
              max: 5,
              ticks: { stepSize: 2 }
            }
          },
          plugins: {
            legend: { display: false },
            annotation: {
              annotations: {
                zero: {
                  type: 'line',
                  yMin: 0,
                  yMax: 0,
                  borderColor: '#ffffff',
                  borderWidth: 2
                },
                four: {
                  type: 'line',
                  yMin: -4,
                  yMax: -4,
                  borderColor: '#f5a623',
                  borderWidth: 2
                },
                eight: {
                  type: 'line',
                  yMin: -8,
                  yMax: -8,
                  borderColor: '#e74c3c',
                  borderWidth: 2
                }
              }
            },
            tooltip: {
              callbacks: {
                label: ctx => `ΔP (Triest – Maribor): ${ctx.raw} hPa`
              }
            }
          }
        }
      });

      storeChart(chart);
    }

    fetchAndUpdateData();
  </script>
</body>
</html>
